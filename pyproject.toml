[project]
name = "percept"
version = "0.1.0"
description = "An autonomous ReAct-style agent that reasons over images using real computer-vision tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<6.0",
    "Pillow>=10.0,<12.0",
    "click>=8.1,<9.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1.0"]
openai = ["openai>=1.50,<2.0"]
gemini = ["google-genai>=0.3,<1.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
percept = "percept.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
percept = ["data/*.onnx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
